[package]
name = "misskey-tauri"
version = "1.1.0"
description = "A Tauri desktop browser that opens misskey.io in-app and routes other links to the external browser."
authors = ["Neko7sora"]
license = "MIT"
edition = "2021"
rust-version = "1.94"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
open = "5.4.5"
tauri = { version = "2.12.5", features = [] }
url = "2.5.8"

[profile.release]
codegen-units = 8
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
