[package]
name = "misskey_isolated_browser"
version = "0.1.0"
description = "A Tauri desktop browser for multiple Misskey instances with isolated remote windows."
authors = ["Neko7sora"]
license = "MIT"
edition = "2021"
rust-version = "1.84"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
url = { version = "2", features = ["serde"] }
